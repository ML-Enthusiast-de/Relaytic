<text x="371.5" y="207.0" text-anchor="middle" font-size="20" fill="#293241">agents</text>
<line x1="301" y1="225" x2="442" y2="225" stroke="#c4ccd8" stroke-width="1"/>
<text x="371.5" y="255.0" text-anchor="middle" font-size="14" fill="#394452">guide, scout, scientist</text>
<text x="371.5" y="273.0" text-anchor="middle" font-size="14" fill="#394452">builder, reviewers, governors</text>
