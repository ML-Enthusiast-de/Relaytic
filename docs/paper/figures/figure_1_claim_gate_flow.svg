<text x="819" y="365" text-anchor="middle" font-size="14" fill="#293241">External agents receive redacted state</text>
<text x="580" y="420" text-anchor="middle" font-size="14" fill="#5b6472">The same artifact graph feeds CLI, skills, MCP adapters, paper tables, and release gates.</text>
